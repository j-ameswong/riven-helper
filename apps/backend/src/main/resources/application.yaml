spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riven_helper}
    username: ${DB_USER:riven_helper}
    password: ${DB_PASSWORD:riven_helper}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# /actuator/health checks Postgres, Redis and disk space
management:
  endpoint:
    health:
      show-details: always

riven-helper:
  rate-limits:
    # 3 requests/s is the documented limit; 350ms leaves some headroom.
    general:
      interval: 350ms
      burst: 1
    # Measured as a burst of ~12-15 refilling at ~6-7/min; 1 every 9s held up.
    auction-search:
      interval: 9s
      burst: 10
